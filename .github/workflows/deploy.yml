name: Deploy to Firebase

# This repo is the sole owner/deployer of Firestore rules for the shared tal-coordinator project
# (see README's "Firestore rules ownership") in addition to its own Hosting site — unlike every
# other app repo in the suite, which only ever deploys `--only hosting`. Every push to main
# deploys both.
#
# Scoped to `firestore:rules` only, not the broader `firestore` target: firestore.indexes.json is
# currently empty, and deploying indexes needs its own IAM role (Cloud Datastore Index Admin) on
# top of what rules deploys need — not worth granting for a no-op. If real indexes ever get added
# there, grant that role to the FIREBASE_SERVICE_ACCOUNT service account and switch this back to
# `--only firestore`.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5, not v4: this is the Node runtime the ACTION ITSELF executes on, unrelated to the
      # node-version: 22 below (that one picks the Node build/toolchain for npm ci/build). v4
      # of both actions still targets the deprecated node20 actions-runtime — GitHub now force-
      # runs those on node24 anyway with a deprecation warning on every run (confirmed live);
      # v5 of each declares node24 natively, so the warning goes away for good instead of
      # riding on a temporary compatibility shim.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project tal-coordinator --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tal-coordinator
          channelId: live
